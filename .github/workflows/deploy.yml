name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建两个站点（学习站与个人站，自动使用仓库名作为 base 子路径）
        env:
          VITEPRESS_BASE: /${{ github.event.repository.name }}/
          PERSONAL_BASE: /${{ github.event.repository.name }}/personal/
        run: npm run build:sites

      - name: 发布边界检查（聚合产物 site-dist，含两站入口校验）
        run: RELEASE_DIST_DIR=site-dist npm run check

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 上传聚合构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
