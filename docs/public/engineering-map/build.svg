<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-label="施工阶段深基坑验槽、外架连墙件、塔吊、混凝土旁站、防水蓄水与动火管控蓝图">
<defs>
  <pattern id="bp-grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#D9D1BC" stroke-width="0.6"/>
  </pattern>
  <pattern id="bp-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#8A6A2F" stroke-width="1.2" opacity="0.35"/>
  </pattern>
  <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E5A9E"/>
  </marker>
  <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#14212E"/>
  </marker>
</defs>
<style>
  text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #14212E; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .title { font-size: 16px; font-weight: 700; }
  .sub { font-size: 11.5px; fill: #334452; }
  .lbl { font-size: 12px; font-weight: 600; }
  .sm { font-size: 10.5px; fill: #334452; }
  .blue { fill: #0E5A9E; }
  .teal { fill: #0E7C86; }
  .green { fill: #2E7A4F; }
  .danger { fill: #D63B22; }
  .white { fill: #FFFFFF; }
  .ink-line { stroke: #14212E; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .blue-line { stroke: #0E5A9E; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .teal-line { stroke: #0E7C86; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .danger-line { stroke: #D63B22; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dash { stroke-dasharray: 5 4; }
</style>
<rect width="800" height="480" fill="#FAF6EB"/>
<rect x="14" y="14" width="772" height="452" fill="url(#bp-grid)" stroke="#14212E" stroke-width="2"/>
<rect x="14" y="14" width="772" height="42" fill="#142231"/>
<text x="28" y="40" class="title white">阶段 06 · 施工过程控制与危大管控蓝图</text>
<text x="772" y="39" text-anchor="end" class="mono sm" style="fill:#FFC72C">DWG EM-06 · GB 55008/55023/55030/55032/55034/55037/37号令/57号令</text>

  <!-- 主体工地剖面区 -->
  <rect x="30" y="70" width="490" height="350" rx="8" fill="#FFFFFF" stroke="#14212E" stroke-width="1.8"/>
  <text x="46" y="94" class="lbl blue">一、现场施工与强制控制剖面</text>
  <!-- 地坪线与基坑支护 -->
  <line x1="48" y1="322" x2="504" y2="322" stroke="#14212E" stroke-width="2"/>
  <rect x="116" y="322" width="14" height="72" fill="#5C6B78" stroke="#14212E" stroke-width="1.4"/>
  <rect x="380" y="322" width="14" height="72" fill="#5C6B78" stroke="#14212E" stroke-width="1.4"/>
  <rect x="130" y="322" width="250" height="46" fill="#EFE9D9" stroke="#14212E" stroke-width="1.4"/>
  <text x="255" y="344" text-anchor="middle" class="sm" style="font-weight:700">01 深基坑支护与五方验槽</text>
  <text x="255" y="360" text-anchor="middle" class="sm">勘察/设计/监理/施工/建设五方签字</text>

  <!-- 主体框架 3层 -->
  <rect x="148" y="168" width="214" height="154" fill="#DCEBFA" fill-opacity="0.4" stroke="#14212E" stroke-width="2"/>
  <line x1="148" y1="220" x2="362" y2="220" stroke="#14212E" stroke-width="2"/>
  <line x1="148" y1="272" x2="362" y2="272" stroke="#14212E" stroke-width="2"/>
  <line x1="218" y1="168" x2="218" y2="322" stroke="#14212E" stroke-width="1.8"/>
  <line x1="292" y1="168" x2="292" y2="322" stroke="#14212E" stroke-width="1.8"/>

  <!-- 02 绿色安全网外架 + 连墙件/剪刀撑 -->
  <rect x="136" y="158" width="238" height="164" fill="#2E7A4F" fill-opacity="0.1" stroke="#2E7A4F" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="136" y1="205" x2="148" y2="205" stroke="#D63B22" stroke-width="2.5"/>
  <line x1="362" y1="205" x2="374" y2="205" stroke="#D63B22" stroke-width="2.5"/>
  <line x1="136" y1="255" x2="148" y2="255" stroke="#D63B22" stroke-width="2.5"/>
  <line x1="362" y1="255" x2="374" y2="255" stroke="#D63B22" stroke-width="2.5"/>
  <text x="255" y="150" text-anchor="middle" class="sm green" style="font-weight:700">02 外架与高支模：连墙件刚性拉结 · 剪刀撑（GB 55023）</text>

  <!-- 03 塔吊 -->
  <rect x="424" y="108" width="14" height="214" fill="#FFC72C" stroke="#14212E" stroke-width="1.5"/>
  <polygon points="315,116 476,116 476,126 315,126" fill="#FFC72C" stroke="#14212E" stroke-width="1.5"/>
  <line x1="431" y1="96" x2="330" y2="116" stroke="#14212E" stroke-width="1.3"/>
  <line x1="431" y1="96" x2="472" y2="116" stroke="#14212E" stroke-width="1.3"/>
  <text x="456" y="190" class="sm" style="font-weight:700">03 塔吊</text>
  <text x="456" y="206" class="sm">起重吊装</text>

  <!-- 标注标签 -->
  <rect x="46" y="216" width="84" height="44" rx="4" fill="#FFFFFF" stroke="#0E5A9E" stroke-width="1.4"/>
  <text x="88" y="234" text-anchor="middle" class="sm blue" style="font-weight:700">04 混凝土旁站</text>
  <text x="88" y="250" text-anchor="middle" class="sm">严禁加水 · 试块</text>

  <rect x="46" y="268" width="84" height="44" rx="4" fill="#FFFFFF" stroke="#0E7C86" stroke-width="1.4"/>
  <text x="88" y="286" text-anchor="middle" class="sm teal" style="font-weight:700">05 防水蓄水</text>
  <text x="88" y="302" text-anchor="middle" class="sm">蓄水≥24h/淋2h</text>

  <!-- 危大警示横幅（红） -->
  <rect x="46" y="110" width="260" height="28" rx="4" fill="#D63B22" stroke="#14212E" stroke-width="1.4"/>
  <text x="176" y="128" text-anchor="middle" class="sm white" style="font-weight:700">危大红线：37号令 + 建办质〔2024〕63号 + 5号隐患</text>

  <!-- 右侧：并行监理管控四线 -->
  <rect x="536" y="70" width="234" height="350" rx="8" fill="#FFFFFF" stroke="#14212E" stroke-width="1.8"/>
  <text x="552" y="96" class="lbl blue">二、监理过程管控闭环</text>

  <rect x="554" y="112" width="198" height="66" rx="6" fill="#DCEBFA" stroke="#0E5A9E" stroke-width="1.5"/>
  <text x="653" y="132" text-anchor="middle" class="sm blue" style="font-weight:700">质量与检测（GB 55032 + 57号令）</text>
  <text x="653" y="150" text-anchor="middle" class="sm">B.0.6 材料进场 → 建设方委托检测</text>
  <text x="653" y="167" text-anchor="middle" class="sm">三检制 → B.0.7 隐蔽 → B.0.8 分部</text>

  <rect x="554" y="188" width="198" height="66" rx="6" fill="#FDECE9" stroke="#D63B22" stroke-width="1.6"/>
  <text x="653" y="208" text-anchor="middle" class="sm danger" style="font-weight:700">危大与消防安全（GB 55034/55037）</text>
  <text x="653" y="226" text-anchor="middle" class="sm">技术负责人＋总监签字＋5专家论证</text>
  <text x="653" y="243" text-anchor="middle" class="sm">06 动火审批 · 有限空间持证监护工</text>

  <rect x="554" y="264" width="198" height="66" rx="6" fill="#FFF8DC" stroke="#14212E" stroke-width="1.5"/>
  <text x="653" y="284" text-anchor="middle" class="sm" style="font-weight:700">缺陷处置与停复工闭环</text>
  <text x="653" y="302" text-anchor="middle" class="sm">A.0.3 监理通知单 → B.0.9 回复</text>
  <text x="653" y="319" text-anchor="middle" class="sm">A.0.5 暂停令 → B.0.3 / A.0.7 复工</text>

  <rect x="554" y="340" width="198" height="66" rx="6" fill="#E8F5EE" stroke="#2E7A4F" stroke-width="1.5"/>
  <text x="653" y="360" text-anchor="middle" class="sm green" style="font-weight:700">变更、延期索赔与进度款</text>
  <text x="653" y="378" text-anchor="middle" class="sm">C.0.2 变更 · B.0.13/14 延期索赔</text>
  <text x="653" y="395" text-anchor="middle" class="sm">B.0.11 审核 → A.0.8 支付证书</text>

<rect x="14" y="436" width="772" height="30" fill="#EFE9D9" stroke="#14212E" stroke-width="1.5"/>
<rect x="26" y="446" width="12" height="12" rx="2" fill="#D63B22" stroke="#14212E" stroke-width="1"/><text x="44" y="456" class="sm">危大/连墙件/动火红线</text><rect x="183" y="446" width="12" height="12" rx="2" fill="#2E7A4F" stroke="#14212E" stroke-width="1"/><text x="201" y="456" class="sm">外架防护/变更支付</text><rect x="318" y="446" width="12" height="12" rx="2" fill="#0E5A9E" stroke="#14212E" stroke-width="1"/><text x="336" y="456" class="sm">质量旁站与验收</text><rect x="431" y="446" width="12" height="12" rx="2" fill="#0E7C86" stroke="#14212E" stroke-width="1"/><text x="449" y="456" class="sm">防水蓄水试验</text>
<text x="772" y="455" text-anchor="end" class="mono sm">DWG EM-06</text>
</svg>