<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-label="竣工验收阶段成型建筑、四方质量报告、永久性责任标牌与验收备案蓝图">
<defs>
  <pattern id="bp-grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#D9D1BC" stroke-width="0.6"/>
  </pattern>
  <pattern id="bp-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#8A6A2F" stroke-width="1.2" opacity="0.35"/>
  </pattern>
  <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E5A9E"/>
  </marker>
  <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#14212E"/>
  </marker>
</defs>
<style>
  text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #14212E; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .title { font-size: 16px; font-weight: 700; }
  .sub { font-size: 11.5px; fill: #334452; }
  .lbl { font-size: 12px; font-weight: 600; }
  .sm { font-size: 10.5px; fill: #334452; }
  .blue { fill: #0E5A9E; }
  .teal { fill: #0E7C86; }
  .green { fill: #2E7A4F; }
  .danger { fill: #D63B22; }
  .white { fill: #FFFFFF; }
  .ink-line { stroke: #14212E; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .blue-line { stroke: #0E5A9E; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .teal-line { stroke: #0E7C86; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .danger-line { stroke: #D63B22; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dash { stroke-dasharray: 5 4; }
</style>
<rect width="800" height="480" fill="#FAF6EB"/>
<rect x="14" y="14" width="772" height="452" fill="url(#bp-grid)" stroke="#14212E" stroke-width="2"/>
<rect x="14" y="14" width="772" height="42" fill="#142231"/>
<text x="28" y="40" class="title white">阶段 07 · 竣工验收与消防备案蓝图</text>
<text x="772" y="39" text-anchor="end" class="mono sm" style="fill:#FFC72C">DWG EM-07 · GB 55032/GB 55037/质量管理条例</text>

  <!-- 左侧：成型建筑与现场查验 -->
  <rect x="30" y="70" width="410" height="350" rx="8" fill="#FFFFFF" stroke="#14212E" stroke-width="1.8"/>
  <text x="46" y="94" class="lbl green">一、成型建筑实体验收与消防查验</text>
  <!-- 建筑主体 -->
  <rect x="95" y="140" width="240" height="176" fill="#FFFFFF" stroke="#14212E" stroke-width="2"/>
  <polygon points="335,140 368,158 368,316 335,316" fill="#DCEBFA" stroke="#14212E" stroke-width="1.8"/>
  <rect x="90" y="128" width="250" height="14" fill="#142231"/>
  <!-- 窗户阵列 -->
  <g fill="#DCEBFA" stroke="#14212E" stroke-width="1.2">
    <rect x="114" y="158" width="32" height="24"/><rect x="164" y="158" width="32" height="24"/><rect x="214" y="158" width="32" height="24"/><rect x="264" y="158" width="32" height="24"/>
    <rect x="114" y="202" width="32" height="24"/><rect x="164" y="202" width="32" height="24"/><rect x="214" y="202" width="32" height="24"/><rect x="264" y="202" width="32" height="24"/>
    <rect x="114" y="246" width="32" height="24"/><rect x="164" y="246" width="32" height="24"/><rect x="264" y="246" width="32" height="24"/>
  </g>
  <rect x="206" y="268" width="48" height="48" fill="#0E5A9E" stroke="#14212E" stroke-width="1.5"/>
  <!-- 永久性质量责任标牌 -->
  <rect x="268" y="282" width="54" height="24" rx="2" fill="#FFC72C" stroke="#14212E" stroke-width="1.3"/>
  <text x="295" y="297" text-anchor="middle" style="font-size:8.5px;font-weight:700">责任标牌</text>
  <!-- 室外道路与消防车道 -->
  <rect x="46" y="316" width="376" height="22" fill="#E4DBC4" stroke="#14212E" stroke-width="1.4"/>
  <text x="234" y="331" text-anchor="middle" class="sm">02 消防车道畅通 / 03 室外管网与竣工规划核实</text>
  <text x="234" y="362" text-anchor="middle" class="sm">01 观感质量检查仅限「分部工程」和「单位工程」</text>
  <text x="234" y="382" text-anchor="middle" class="sm">04 建筑物明显部位设置永久性质量责任标牌（五方负责人）</text>
  <text x="234" y="402" text-anchor="middle" class="sm blue">缺失资料按 GB 55032 2.0.7 委托实体检验补齐</text>

  <!-- 右侧：四方报告与双验收链 -->
  <rect x="458" y="70" width="312" height="350" rx="8" fill="#FFFFFF" stroke="#14212E" stroke-width="1.8"/>
  <text x="474" y="94" class="lbl blue">二、四方报告区分与竣工备案流程</text>

  <rect x="476" y="108" width="276" height="114" rx="6" fill="#EFE9D9" stroke="#14212E" stroke-width="1.4"/>
  <text x="614" y="128" text-anchor="middle" class="sm" style="font-weight:700">预验收后提交的四方质量文件（易混点）</text>
  <text x="490" y="150" class="sm">• 勘察、设计：《工程质量检查报告》</text>
  <text x="490" y="170" class="sm">• 施工单位：《工程竣工报告》＋ 质量保修书</text>
  <text x="490" y="190" class="sm blue">• 监理单位：《工程质量评估报告》</text>
  <text x="500" y="208" class="sm">（须总监＋监理单位技术负责人审核签字）</text>

  <rect x="476" y="232" width="276" height="58" rx="6" fill="#E8F5EE" stroke="#2E7A4F" stroke-width="1.5"/>
  <text x="614" y="253" text-anchor="middle" class="sm green" style="font-weight:700">建设单位组织正式竣工验收（含消防查验）</text>
  <text x="614" y="273" text-anchor="middle" class="sm">核定实际竣工日期（验收合格日 / 拖延 / 擅自使用）</text>

  <rect x="476" y="300" width="276" height="48" rx="6" fill="#FDECE9" stroke="#D63B22" stroke-width="1.5"/>
  <text x="614" y="320" text-anchor="middle" class="sm danger" style="font-weight:700">消防验收（特殊工程）或消防备案抽查</text>
  <text x="614" y="338" text-anchor="middle" class="sm">未通过消防验收不得投入使用</text>

  <rect x="476" y="358" width="276" height="48" rx="6" fill="#DCEBFA" stroke="#0E5A9E" stroke-width="1.5"/>
  <text x="614" y="378" text-anchor="middle" class="sm blue" style="font-weight:700">工程竣工验收备案（合格后 15 日内）</text>
  <text x="614" y="396" text-anchor="middle" class="sm">建设单位向建设主管部门办理（区别于消防备案）</text>

<rect x="14" y="436" width="772" height="30" fill="#EFE9D9" stroke="#14212E" stroke-width="1.5"/>
<rect x="26" y="446" width="12" height="12" rx="2" fill="#2E7A4F" stroke="#14212E" stroke-width="1"/><text x="44" y="456" class="sm">竣工验收通过</text><rect x="128" y="446" width="12" height="12" rx="2" fill="#0E5A9E" stroke="#14212E" stroke-width="1"/><text x="146" y="456" class="sm">评估报告/15日备案</text><rect x="274" y="446" width="12" height="12" rx="2" fill="#FFC72C" stroke="#14212E" stroke-width="1"/><text x="292" y="456" class="sm">永久责任标牌</text><rect x="376" y="446" width="12" height="12" rx="2" fill="#D63B22" stroke="#14212E" stroke-width="1"/><text x="394" y="456" class="sm">消防验收/禁擅用</text>
<text x="772" y="455" text-anchor="end" class="mono sm">DWG EM-07</text>
</svg>