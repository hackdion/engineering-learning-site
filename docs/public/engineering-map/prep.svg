<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-label="施工准备场地总平图，标注01至09全部设施与开工令签发流程">
<defs>
  <pattern id="bp-grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#D9D1BC" stroke-width="0.6"/>
  </pattern>
  <pattern id="bp-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#8A6A2F" stroke-width="1.2" opacity="0.35"/>
  </pattern>
  <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#0E5A9E"/>
  </marker>
  <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#14212E"/>
  </marker>
</defs>
<style>
  text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #14212E; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .title { font-size: 16px; font-weight: 700; }
  .sub { font-size: 11.5px; fill: #334452; }
  .lbl { font-size: 12px; font-weight: 600; }
  .sm { font-size: 10.5px; fill: #334452; }
  .blue { fill: #0E5A9E; }
  .teal { fill: #0E7C86; }
  .green { fill: #2E7A4F; }
  .danger { fill: #D63B22; }
  .white { fill: #FFFFFF; }
  .ink-line { stroke: #14212E; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .blue-line { stroke: #0E5A9E; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .teal-line { stroke: #0E7C86; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .danger-line { stroke: #D63B22; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dash { stroke-dasharray: 5 4; }
</style>
<rect width="800" height="480" fill="#FAF6EB"/>
<rect x="14" y="14" width="772" height="452" fill="url(#bp-grid)" stroke="#14212E" stroke-width="2"/>
<rect x="14" y="14" width="772" height="42" fill="#142231"/>
<text x="28" y="40" class="title white">阶段 05 · 施工准备与场地分区蓝图</text>
<text x="772" y="39" text-anchor="end" class="mono sm" style="fill:#FFC72C">DWG EM-05 · GB 55032/GB 55034/GB 2894—2025/应急管理部令第19号</text>

  <!-- 左侧：工地总平面分区示意 (01~09) -->
  <rect x="30" y="70" width="490" height="350" rx="8" fill="#FFFFFF" stroke="#14212E" stroke-width="1.8"/>
  <text x="46" y="94" class="lbl blue">一、施工现场封闭围挡与三区分设（GB 55034）</text>
  <!-- 02 封闭围挡外框 -->
  <rect x="48" y="106" width="454" height="296" rx="4" fill="#FAF6EB" stroke="#14212E" stroke-width="3"/>
  <rect x="220" y="99" width="110" height="18" rx="3" fill="#142231"/>
  <text x="275" y="112" text-anchor="middle" class="sm white">02 连续封闭围挡</text>

  <!-- 办公生活区（左侧隔离） -->
  <rect x="60" y="124" width="190" height="218" rx="6" fill="#E8F5EE" stroke="#2E7A4F" stroke-width="1.5"/>
  <text x="155" y="142" text-anchor="middle" class="sm green">办公 / 生活区（与作业区严格分开）</text>
  <!-- 01 项目部 -->
  <rect x="74" y="152" width="162" height="46" rx="4" fill="#FFFFFF" stroke="#0E5A9E" stroke-width="1.5"/>
  <text x="155" y="172" text-anchor="middle" class="lbl blue">01 项目部办公区</text>
  <text x="155" y="189" text-anchor="middle" class="sm">例会 / 审图 / 监理资料</text>
  <!-- 06 独立生活宿舍 -->
  <rect x="74" y="208" width="162" height="58" rx="4" fill="#FFFFFF" stroke="#2E7A4F" stroke-width="1.5"/>
  <text x="155" y="228" text-anchor="middle" class="lbl green">06 独立生活区宿舍</text>
  <text x="155" y="245" text-anchor="middle" class="sm danger">严禁设于未竣工建筑内</text>
  <text x="155" y="259" text-anchor="middle" class="sm">36V以下安全照明/禁大功率</text>
  <!-- 07 食堂 -->
  <rect x="74" y="276" width="162" height="52" rx="4" fill="#FFFFFF" stroke="#0E7C86" stroke-width="1.5"/>
  <text x="155" y="298" text-anchor="middle" class="lbl teal">07 现场食堂卫生区</text>
  <text x="155" y="316" text-anchor="middle" class="sm">远离污染源 · 持证上岗</text>

  <!-- 作业与准备区（右侧） -->
  <rect x="262" y="124" width="226" height="218" rx="6" fill="#DCEBFA" fill-opacity="0.45" stroke="#0E5A9E" stroke-width="1.5"/>
  <text x="375" y="142" text-anchor="middle" class="sm blue">施工准备与作业区</text>
  <!-- 拟建建筑控制网 -->
  <rect x="278" y="156" width="194" height="92" rx="4" fill="#FFFFFF" stroke="#0E5A9E" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="375" y="182" text-anchor="middle" class="lbl blue">平面与高程控制网复测</text>
  <text x="375" y="202" text-anchor="middle" class="sm">GB 55032 3.3.1 专监查验签字</text>
  <text x="375" y="222" text-anchor="middle" class="sm">勘察说明＋设计交底＋图纸会审</text>
  <!-- 08 消防器材与标志 -->
  <rect x="278" y="260" width="94" height="68" rx="4" fill="#FDECE9" stroke="#D63B22" stroke-width="1.5"/>
  <text x="325" y="282" text-anchor="middle" class="sm danger" style="font-weight:700">08 消防站</text>
  <text x="325" y="300" text-anchor="middle" class="sm">GB 2894—2025</text>
  <text x="325" y="316" text-anchor="middle" class="sm">安全标志牌</text>
  <!-- 09 临电配电与样板 -->
  <rect x="380" y="260" width="92" height="68" rx="4" fill="#FFF8DC" stroke="#14212E" stroke-width="1.5"/>
  <text x="426" y="282" text-anchor="middle" class="sm" style="font-weight:700">09 临电/样板</text>
  <text x="426" y="300" text-anchor="middle" class="sm">TN-S 三级配电</text>
  <text x="426" y="316" text-anchor="middle" class="sm">分项样板引路</text>

  <!-- 出入口区（底部） -->
  <rect x="74" y="352" width="124" height="40" rx="4" fill="#E4DBC4" stroke="#14212E" stroke-width="1.4"/>
  <text x="136" y="370" text-anchor="middle" class="sm" style="font-weight:700">03 车行入口+洗车槽</text>
  <text x="136" y="385" text-anchor="middle" class="sm">人车分流 · 净车出场</text>

  <rect x="212" y="352" width="132" height="40" rx="4" fill="#DCEBFA" stroke="#0E5A9E" stroke-width="1.4"/>
  <text x="278" y="370" text-anchor="middle" class="sm blue" style="font-weight:700">04 实名制人员门禁</text>
  <text x="278" y="385" text-anchor="middle" class="sm">人脸/刷卡非唯一核验</text>

  <rect x="358" y="352" width="114" height="40" rx="4" fill="#FFC72C" stroke="#14212E" stroke-width="1.4"/>
  <text x="415" y="370" text-anchor="middle" class="sm" style="font-weight:700">05 保安室</text>
  <text x="415" y="385" text-anchor="middle" class="sm">24h 值守登记</text>

  <!-- 右侧：开工条件审查与签发链 -->
  <rect x="536" y="70" width="234" height="350" rx="8" fill="#FFFFFF" stroke="#14212E" stroke-width="1.8"/>
  <text x="552" y="96" class="lbl blue">二、开工条件审查闭环</text>
  <rect x="554" y="114" width="198" height="46" rx="6" fill="#EFE9D9" stroke="#14212E" stroke-width="1.3"/>
  <text x="653" y="135" text-anchor="middle" class="sm" style="font-weight:700">监理规划/细则 + 首次工地会</text>
  <text x="653" y="151" text-anchor="middle" class="sm">质量策划 · 全员质量培训</text>

  <rect x="554" y="170" width="198" height="46" rx="6" fill="#EFE9D9" stroke="#14212E" stroke-width="1.3"/>
  <text x="653" y="191" text-anchor="middle" class="sm" style="font-weight:700">人员与器具核验（应急45号）</text>
  <text x="653" y="207" text-anchor="middle" class="sm">10类19项特种作业 + 计量检定</text>

  <rect x="554" y="226" width="198" height="46" rx="6" fill="#DCEBFA" stroke="#0E5A9E" stroke-width="1.4"/>
  <text x="653" y="247" text-anchor="middle" class="sm blue" style="font-weight:700">B.0.1 施组 + B.0.4 分包报审</text>
  <text x="653" y="263" text-anchor="middle" class="sm">专监审查 · 总监签认</text>

  <rect x="554" y="282" width="198" height="48" rx="6" fill="#FFF8DC" stroke="#14212E" stroke-width="1.4"/>
  <text x="653" y="303" text-anchor="middle" class="sm" style="font-weight:700">B.0.2 工程开工报审表</text>
  <text x="653" y="320" text-anchor="middle" class="sm">总监审查 → 建设单位批准</text>

  <line x1="653" y1="330" x2="653" y2="352" class="blue-line" marker-end="url(#arr-blue)"/>

  <rect x="554" y="356" width="198" height="48" rx="6" fill="#2E7A4F" stroke="#14212E" stroke-width="1.6"/>
  <text x="653" y="378" text-anchor="middle" class="lbl white">A.0.2 签发工程开工令</text>
  <text x="653" y="395" text-anchor="middle" class="sm white">总监签字＋加盖执业印章</text>

<rect x="14" y="436" width="772" height="30" fill="#EFE9D9" stroke="#14212E" stroke-width="1.5"/>
<rect x="26" y="446" width="12" height="12" rx="2" fill="#2E7A4F" stroke="#14212E" stroke-width="1"/><text x="44" y="456" class="sm">生活隔离/开工令</text><rect x="150" y="446" width="12" height="12" rx="2" fill="#0E5A9E" stroke="#14212E" stroke-width="1"/><text x="168" y="456" class="sm">测量与报审</text><rect x="241" y="446" width="12" height="12" rx="2" fill="#FFC72C" stroke="#14212E" stroke-width="1"/><text x="259" y="456" class="sm">门卫/临电样板</text><rect x="354" y="446" width="12" height="12" rx="2" fill="#D63B22" stroke="#14212E" stroke-width="1"/><text x="372" y="456" class="sm">禁住未竣工楼/消防</text>
<text x="772" y="455" text-anchor="end" class="mono sm">DWG EM-05</text>
</svg>