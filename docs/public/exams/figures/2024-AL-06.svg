  <!-- J 10-13 -->
  <path d="M480,243 L480,300 L606,300 L606,343" fill="none" stroke="currentColor" stroke-width="1.8" marker-end="url(#ah6)"/>
  <text x="540" y="288" text-anchor="middle">J</text><text x="540" y="324" text-anchor="middle">3</text>
